<!DOCTYPE html>
<html lang="en" class="h-full bg-slate-50">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Table Reservation Floorplan</title>
    <!-- Tailwind CSS CDN for modern utilities -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Inter Google Font -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <!-- FontAwesome for floorplan icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        body {
            font-family: 'Inter', sans-serif;
        }
        ::-webkit-scrollbar {
            width: 6px;
            height: 6px;
        }
        ::-webkit-scrollbar-track {
            background: #f1f5f9;
        }
        ::-webkit-scrollbar-thumb {
            background: #cbd5e1;
            border-radius: 4px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: #94a3b8;
        }
    </style>
</head>
<body class="h-full flex flex-col text-slate-800"> 
    <!-- TOP NAVIGATION BAR -->
    <nav class="bg-white border-b border-slate-200 shrink-0">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
            <div class="flex justify-between h-16 items-center">
                <div class="flex items-center space-x-3">
                    <div class="bg-amber-600 text-white p-2.5 rounded-xl shadow-md shadow-amber-600/20">
                        <i class="fa-solid fa-utensils text-xl"></i>
                    </div>
                    <div>
                        <h1 class="text-xl font-bold text-slate-900 tracking-tight">Table Reservation</h1>
                        <p class="text-xs text-slate-500 font-medium">Interactive Floor Plan Manager</p>
                    </div>
                </div>
                <div class="hidden sm:flex items-center space-x-4 text-xs font-semibold">
                    <span class="flex items-center px-3 py-1.5 rounded-full bg-emerald-50 text-emerald-700 border border-emerald-200">
                        <span class="w-2 h-2 rounded-full bg-emerald-500 mr-2 animate-pulse"></span>
                        Backend Connected
                    </span>
                    <span class="text-slate-400">|</span>
                    <span class="text-slate-600" id="current-time-display">July 2026</span>
                </div>
            </div>
        </div>
    </nav>

       <!-- MAIN APPLICATION CONTAINER -->
    <main class="flex-1 max-w-7xl w-full mx-auto p-4 sm:p-6 lg:p-8 flex flex-col lg:flex-row gap-6 min-h-0 overflow-y-auto lg:overflow-hidden">
        
        <!-- LEFT: THE FLOORPLAN AND STATUS INDICATORS -->
        <section class="flex-1 flex flex-col gap-4 min-h-0">
            <!-- Filter & Legend Toolbar -->
            <div class="bg-white p-4 rounded-2xl border border-slate-200 shadow-sm flex flex-wrap gap-4 items-center justify-between">
                <div class="flex gap-2" id="filter-container">
                    <button onclick="filterTables('all')" id="filter-all" class="px-3.5 py-1.5 rounded-lg text-xs font-medium bg-slate-900 text-white transition-all">
                        All Tables
                    </button>
                    <button onclick="filterTables('available')" id="filter-available" class="px-3.5 py-1.5 rounded-lg text-xs font-medium text-slate-600 hover:bg-slate-100 transition-all">
                        Available
                    </button>
                    <button onclick="filterTables('large')" id="filter-large" class="px-3.5 py-1.5 rounded-lg text-xs font-medium text-slate-600 hover:bg-slate-100 transition-all">
                        Family (4+ seats)
                    </button>
                </div>
                <div class="flex flex-wrap gap-3.5 text-xs font-semibold text-slate-600">
                    <span class="flex items-center"><span class="w-3 h-3 rounded-full bg-emerald-100 border-2 border-emerald-500 mr-1.5"></span> Available</span>
                    <span class="flex items-center"><span class="w-3 h-3 rounded-full bg-rose-100 border-2 border-rose-500 mr-1.5"></span> Reserved</span>
                    <span class="flex items-center"><span class="w-3 h-3 rounded-full bg-amber-500 mr-1.5"></span> Selected</span>
                    <span class="flex items-center"><span class="w-3 h-3 rounded-full bg-slate-200 border-2 border-slate-400 mr-1.5"></span> Out of Service</span>
                </div>
            </div>

            <!-- RESTAURANT Blueprint Floor Plan Container -->
            <div class="flex-1 bg-slate-900 border border-slate-800 rounded-3xl p-6 relative flex flex-col justify-between overflow-auto min-h-[500px] shadow-inner">
                <div class="absolute inset-0 bg-[radial-gradient(#ffffff10_1px,transparent_1px)] [background-size:16px_16px] pointer-events-none rounded-3xl"></div>
                
                <!-- TOP FLOOR SECTION -->
                <div class="grid grid-cols-12 gap-4 relative z-10">
                    
                    <!-- LEFT PRIVATE AREA -->
                    <div class="col-span-3 bg-slate-800/80 border border-slate-700/50 rounded-2xl p-4 flex flex-col justify-between min-h-[180px]">
                        <div class="flex items-center justify-between text-[11px] font-bold text-slate-400 tracking-wider uppercase">
                            <span><i class="fa-solid fa-door-closed mr-1"></i> Private A</span>
                        </div>
                        <div class="flex flex-col items-center justify-center gap-6 py-4" id="private-a-tables"></div>
                    </div>

                    <!-- MAIN HALL -->
                    <div class="col-span-6 bg-slate-800/40 border border-slate-700/30 rounded-2xl p-4 flex flex-col justify-between min-h-[180px]">
                        <div class="flex items-center justify-between text-[11px] font-bold text-slate-400 tracking-wider uppercase">
                            <span><i class="fa-solid fa-hotel mr-1"></i> Main Hall</span>
                            <span class="text-amber-500/70 text-[10px]"><i class="fa-solid fa-music mr-1"></i> Live Music</span>
                        </div>
                        <div class="grid grid-cols-2 gap-4 py-4 justify-items-center" id="main-hall-tables"></div>
                    </div>

                    <!-- RIGHT PRIVATE AREA -->
                    <div class="col-span-3 bg-slate-800/80 border border-slate-700/50 rounded-2xl p-4 flex flex-col justify-between min-h-[180px]">
                        <div class="flex items-center justify-between text-[11px] font-bold text-slate-400 tracking-wider uppercase">
                            <span><i class="fa-solid fa-door-closed mr-1"></i> Private B</span>
                        </div>
                        <div class="flex flex-col items-center justify-center gap-6 py-4" id="private-b-tables"></div>
                    </div>

                </div>

                <!-- MIDDLE CENTER: KITCHEN -->
                <div class="my-6 grid grid-cols-12 gap-4 relative z-10">
                    <div class="col-start-4 col-span-6 bg-slate-850 border border-slate-700 rounded-2xl p-4 flex items-center justify-center shadow-lg relative overflow-hidden h-24">
                        <div class="absolute top-0 inset-x-0 h-[2px] bg-gradient-to-r from-red-500 via-amber-500 to-red-500 animate-pulse"></div>
                        <div class="text-center">
                            <span class="text-[10px] font-black text-amber-500 tracking-widest uppercase block mb-1">
                                <i class="fa-solid fa-fire-burner animate-bounce mr-1"></i> STAFF ONLY
                            </span>
                            <h3 class="text-sm font-bold text-slate-100 uppercase tracking-wider">
                                <i class="fa-solid fa-kitchen-set mr-1.5 text-slate-400"></i>Central Kitchen
                            </h3>
                        </div>
                    </div>
                </div>

                <!-- BOTTOM FLOOR SECTION (TERRACE AREA) -->
                <div class="relative z-10">
                    <div class="bg-amber-950/20 border border-amber-900/30 rounded-2xl p-4 flex flex-col justify-between min-h-[130px]">
                        <div class="flex items-center justify-between text-[11px] font-bold text-amber-500/80 tracking-wider uppercase">
                            <span><i class="fa-solid fa-umbrella-beach mr-1"></i> Outdoor Terrace</span>
                        </div>
                        <div class="flex justify-around items-center gap-4 py-4" id="terrace-tables"></div>
                    </div>
                </div>

            </div>
        </section>


</body>
</html>
